<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klassenauswertung · Adler-Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--navy); color: #fff; }
  .board { max-width: 1400px; margin: 0 auto; padding: 28px 32px; display: grid; grid-template-columns: 1fr 340px; gap: 28px; min-height: 100vh; }
  @media (max-width: 900px) { .board { grid-template-columns: 1fr; padding: 16px; } }
  h1 { max-width: none; font-size: clamp(28px, 3.4vw, 46px); margin: 4px 0 6px; }
  .sub { color: #c9d9df; font-size: 18px; margin: 0 0 24px; }
  .panel { background: var(--navy-2); border-radius: 22px; padding: 24px; }
  .row { display: grid; grid-template-columns: 60px 1fr 64px; align-items: center; gap: 14px; margin: 16px 0; }
  .row .ic { width: 56px; height: 56px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; font-size: 28px; }
  .row .nm { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .row .nm small { font-weight: 400; color: #a9c0c8; font-size: 14px; margin-left: 6px; }
  .row .tr { height: 22px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
  .row .fl { height: 100%; background: var(--sage); border-radius: 99px; transition: width .6s ease; }
  .row.top .fl { background: var(--gold); }
  .row .n { font-size: 30px; font-weight: 800; text-align: right; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 20px; }
  .stat { background: var(--navy-2); border-radius: 18px; padding: 20px; }
  .stat .v { font-size: 52px; font-weight: 800; color: var(--gold); line-height: 1; }
  .stat .l { color: #c9d9df; margin-top: 8px; font-size: 16px; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .qr { background: #fff; border-radius: 22px; padding: 20px; text-align: center; color: var(--navy); }
  .qr #qrcode { display: grid; place-items: center; margin: 6px 0 10px; }
  .qr #qrcode svg { width: 100%; max-width: 280px; height: auto; }
  .qr #qrcode svg path, .qr #qrcode svg rect[fill="black"] { fill: #1B3A4B; }
  .qr b { font-size: 20px; }
  .qr .url { font-size: 13px; color: var(--muted); word-break: break-all; margin-top: 6px; }
  .lv { display: grid; gap: 10px; }
  .lv div { display: flex; justify-content: space-between; font-size: 16px; color: #dfe9ec; }
  .lv b { color: var(--gold); }
  .ctrl { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: #a9c0c8; align-items: center; }
  .ctrl button { background: transparent; border: 1px solid #4a6b7c; color: #c9d9df; border-radius: 10px; padding: 6px 10px; font-size: 13px; }
  .status { font-size: 14px; color: #a9c0c8; }
  .empty { color: #c9d9df; font-size: 18px; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="board">
  <div>
    <div class="eyebrow">Live · Klassenauswertung</div>
    <h1>Wie adlerianisch denkt die Klasse?</h1>
    <p class="sub"><span id="total">0</span> Teilnahmen · <span class="status" id="status">verbinde …</span></p>

    <div class="panel" id="types"></div>

    <div class="stats">
      <div class="stat"><div class="v" id="avg">–</div><div class="l">durchschnittlicher Adler-Wert</div></div>
      <div class="stat"><div class="v" id="avgPts">–</div><div class="l">Punkte im Schnitt (von 18)</div></div>
    </div>
  </div>

  <div class="side">
    <div class="qr">
      <b>Mitmachen!</b>
      <div id="qrcode"></div>
      <div class="url" id="url"></div>
    </div>
    <div class="panel">
      <div class="eyebrow" style="margin-bottom:12px">Adler-Stufen</div>
      <div class="lv" id="levels"></div>
    </div>
    <div class="ctrl">
      <button id="reset">Zähler ab jetzt neu</button>
      <button id="all">Alle Einträge zeigen</button>
    </div>
  </div>
</div>

<script src="qrcode.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
(function () {
  const D = window.ADLER, C = window.ADLER_CONFIG || {};
  const testUrl = new URL("./", location.href).href;
  document.getElementById("url").textContent = testUrl.replace(/^https?:\/\//, "");
  try { const q = qrcode(0, "M"); q.addData(testUrl); q.make(); document.getElementById("qrcode").innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true }); } catch (e) {}

  // Standard: nur Einträge der letzten 3 Stunden (damit alte Tests nicht mitzählen)
  function getSince() {
    try { const v = localStorage.getItem("adler_since"); if (v) return v; } catch (e) {}
    return new Date(Date.now() - 3 * 3600 * 1000).toISOString();
  }
  let since = getSince();
  document.getElementById("reset").onclick = () => {
    since = new Date().toISOString();
    try { localStorage.setItem("adler_since", since); } catch (e) {}
    load();
  };
  document.getElementById("all").onclick = () => {
    since = "1970-01-01T00:00:00Z";
    try { localStorage.removeItem("adler_since"); } catch (e) {}
    load();
  };

  function draw(rows) {
    const counts = { mitgestalter: 0, macher: 0, mitlaeufer: 0, ausweicher: 0 };
    let pts = 0;
    const lv = [0, 0, 0];
    rows.forEach(r => {
      const t = D.mainType(r.type);
      if (t in counts) counts[t]++;
      pts += r.adler_score;
      lv[D.levels.indexOf(D.level(r.adler_score))]++;
    });
    const n = rows.length;
    document.getElementById("total").textContent = n;
    const max = Math.max(1, ...Object.values(counts));
    const topN = Math.max(...Object.values(counts));
    const el = document.getElementById("types");
    if (!n) {
      el.innerHTML = `<div class="empty">Noch keine Ergebnisse – scannt den QR-Code und legt los!</div>`;
    } else {
      el.innerHTML = D.mainTypes.map(k => {
        const t = D.types[k];
        return `<div class="row ${counts[k] === topN && topN > 0 ? "top" : ""}">
          <div class="ic">${t.icon}</div>
          <div><div class="nm">${t.name}<small>${t.adler.replace("Adlers ", "")}</small></div>
            <div class="tr"><div class="fl" style="width:${counts[k] / max * 100}%"></div></div></div>
          <div class="n">${counts[k]}</div></div>`;
      }).join("");
    }
    document.getElementById("avg").textContent = n ? Math.round(pts / n / 18 * 100) + " %" : "–";
    document.getElementById("avgPts").textContent = n ? (pts / n).toFixed(1).replace(".", ",") : "–";
    document.getElementById("levels").innerHTML = D.levels.map((l, i) => `<div><span>${l.name}</span><b>${lv[i]}</b></div>`).join("");
  }

  async function load() {
    const st = document.getElementById("status");
    if (!C.supabaseUrl || !C.supabaseKey) { st.textContent = "keine Datenbank eingestellt"; draw([]); return; }
    try {
      const res = await fetch(`${C.supabaseUrl}/rest/v1/results?select=type,adler_score&created_at=gte.${encodeURIComponent(since)}&limit=1000`, {
        headers: { apikey: C.supabaseKey }
      });
      if (!res.ok) throw new Error(res.status);
      const rows = await res.json();
      draw(rows);
      st.textContent = "aktualisiert " + new Date().toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    } catch (e) {
      st.textContent = "Datenbank nicht erreichbar – Supabase-Projekt aufwecken?";
    }
  }
  draw([]);
  load();
  setInterval(load, 4000);
})();
</script>
</body>
</html>
